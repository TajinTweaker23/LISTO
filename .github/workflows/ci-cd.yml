name: 🚀 LISTO Medical App CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  NODE_VERSION: '18.x'
  NEXT_PUBLIC_APP_NAME: 'LISTO Medical Hub'
  
jobs:
  # 🔍 Code Quality & Security Analysis
  analyze:
    name: 🔍 Code Analysis
    runs-on: ubuntu-latest
    
    steps:
    - name: 📁 Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 📦 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: 📥 Install dependencies
      run: npm ci

    - name: 🔍 Run ESLint
      run: npm run lint

    - name: 🧪 Run TypeScript check
      run: npx tsc --noEmit

    - name: 🔒 Security audit
      run: npm audit --audit-level=critical

    - name: SonarCloud Scan
      if: ${{ secrets.SONAR_TOKEN != '' }}
      uses: SonarSource/sonarcloud-github-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # 🧪 Testing Suite
  test:
    name: 🧪 Testing
    runs-on: ubuntu-latest
    needs: analyze
    
    steps:
    - name: 📁 Checkout code
      uses: actions/checkout@v4

    - name: 📦 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: 📥 Install dependencies
      run: npm ci

    - name: 🧪 Run tests
      run: npm test -- --passWithNoTests

  # 🏗️ Build & PWA Optimization
  build:
    name: 🏗️ Build Application
    runs-on: ubuntu-latest
    needs: [analyze, test]
    
    outputs:
      build-hash: ${{ steps.build-hash.outputs.hash }}
    
    steps:
    - name: 📁 Checkout code
      uses: actions/checkout@v4

    - name: 📦 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: 📥 Install dependencies
      run: npm ci

    - name: 🏗️ Build application
      run: npm run build
      env:
        CI: true
        NEXT_TELEMETRY_DISABLED: 1

    - name: 🆔 Generate build hash
      id: build-hash
      run: echo "hash=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

    - name: ⬆️ Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: build-${{ steps.build-hash.outputs.hash }}
        path: .next/
        retention-days: 30

  # � Generate deployment report
  report:
    name: � Generate Report
    runs-on: ubuntu-latest
    needs: build
    if: always()
    
    steps:
    - name: 📈 Generate deployment report
      run: |
        echo "## 🚀 LISTO Medical App Build Report" > deployment-report.md
        echo "- **Build Hash**: ${{ needs.build.outputs.build-hash }}" >> deployment-report.md
        echo "- **Build Time**: $(date)" >> deployment-report.md
        echo "- **PWA Optimized**: ✅" >> deployment-report.md
        echo "- **Mobile Ready**: ✅" >> deployment-report.md
        echo "- **TypeScript**: ✅" >> deployment-report.md
